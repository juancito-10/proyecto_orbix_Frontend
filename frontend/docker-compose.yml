services:
  frontend:
    build:
      context: .
      dockerfile: Dockerfile
    container_name: orbix-frontend
    ports:
      - "5173:80"
    environment:
      BACKEND_HOST: ${BACKEND_HOST:-backend}
      BACKEND_PORT: ${BACKEND_PORT:-3001}
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "wget", "-q", "--spider", "http://127.0.0.1/"]
      interval: 30s
      timeout: 5s
      retries: 3
      start_period: 10s
    networks:
      - orbix-net

networks:
  orbix-net:
    driver: bridge
